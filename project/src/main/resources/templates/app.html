<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>응급의료기관 정보 조회 서비스</title>
    <meta charset="UTF-8">
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 통합된 커스텀 CSS -->
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- 사이드바 메뉴 -->
            <div class="col-3 d-flex flex-column p-3" style="max-width: 300px; background-color: #001f3f; color: white;">
                <h6 class="text-center mb-4">전국 응급의료기관 정보 조회</h6>

                <!-- 시도 및 시군구 선택 -->
                <div class="mb-3">
                    <label for="sido-select" class="form-label" style="color: #cfd8dc;">시도 선택</label>
                    <select id="sido-select" class="form-select">
                        <option value="sido" disabled selected>시도 선택</option>
                        <option value="">전체</option>
                        <option data-bjcd="11" value="서울특별시">서울특별시</option>
                        <option data-bjcd="26" value="부산광역시">부산광역시</option>
                        <option data-bjcd="27" value="대구광역시">대구광역시</option>
                        <option data-bjcd="28" value="인천광역시">인천광역시</option>
                        <option data-bjcd="29" value="광주광역시">광주광역시</option>
                        <option data-bjcd="30" value="대전광역시">대전광역시</option>
                        <option data-bjcd="31" value="울산광역시">울산광역시</option>
                        <option data-bjcd="36" value="세종특별자치시">세종특별자치시</option>
                        <option data-bjcd="41" value="경기도">경기도</option>
                        <option data-bjcd="51" value="강원도">강원도</option>
                        <option data-bjcd="43" value="충청북도">충청북도</option>
                        <option data-bjcd="44" value="충청남도">충청남도</option>
                        <option data-bjcd="52" value="전라북도">전라북도</option>
                        <option data-bjcd="46" value="전라남도">전라남도</option>
                        <option data-bjcd="47" value="경상북도">경상북도</option>
                        <option data-bjcd="48" value="경상남도">경상남도</option>
                        <option data-bjcd="50" value="제주특별자치도">제주특별자치도</option>
                    </select>
                    <select id="sigungu-select" class="form-select mt-2">
                        <option value="sigungu" disabled selected>시군구 선택</option>
                        <option value="">전체</option>
                    </select>
                </div>

                  <!-- 분류 선택 -->
                  <div class="sidemenu-select-box mb-3">
                    <label for="urlType-select" class="form-label" style="color: #cfd8dc;">분류 선택</label>
                    <select id="urlTypeSelect" class="form-select" onchange="setUrlType(this.value)">
                        <option value="getEgytListInfoInqire" selected>응급의료기관 목록정보 조회</option>
                        <option value="getStrmListInfoInqire">외상센터 목록정보 조회</option>
                        <!-- 추가 분류 옵션을 여기에 추가 -->
                    </select>
                </div>

                <!-- 기관명 검색 -->
                <div class="mb-3">
                    <label for="search-input" class="form-label" style="color: #cfd8dc;">기관명 검색</label>
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="기관명을 입력하세요">
                        <button id="searchBtn" class="btn btn-primary">검색</button>
                    </div>
                </div>
                

                <!-- AI 결과 응답 창 -->
                <div class="mb-3" style="max-height: 150px;">
                    <label class="form-label" style="color: #cfd8dc;">AI 응답</label>
                    <div id="aiResponse" class="alert alert-info" style="background-color: #00264d; color: #cfd8dc; border: none; overflow-y: auto; max-height: 120px; height: 120px;">
                        AI의 응답이 표시됩니다.
                    </div>
                </div>

                <!-- AI 결과 입력 창 -->
                <div class="mb-3">
                    <label for="aiInput" class="form-label" style="color: #cfd8dc;">AI 질문 입력</label>
                    <textarea id="aiInput" class="form-control" rows="3" placeholder="현재 느끼는 증상을 입력해 주세요."></textarea>
                </div>

                <!-- AI 입력 전송 버튼 -->
                <button id="aiBtn" class="btn btn-primary w-100">
                    <span  class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    질문하기
                </button>
                <button id="loadingBtn"  style="display: none;" class="btn btn-primary" type="button" disabled>
                    <span  class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    분석중
                </button>

                <div class="text-center mt-auto pt-3" style="color: #cfd8dc;">
                    <small>Copyright © 2024</small>
                </div>
            </div>

            <!-- 지도 영역 -->
            <div class="col">
                <div id="map" class="ol-map-container">
                    <!-- 내 위치 조회 버튼 -->
                    <button id="locationBtn" class="location-button">내 위치 조회</button>
                </div>
            </div>
        </div>
    </div>
<!-- 모달 구조 -->
<div id="hospitalModal" class="modal fade" tabindex="-1" aria-labelledby="hospitalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- 모달 헤더 -->
        <div class="modal-header">
          <h5 class="modal-title" id="hospitalModalLabel">병원 정보</h5>
          <button type="button" class="btn-close btn-primary" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <!-- 모달 본문 -->
        <div class="modal-body" id="modalBodyContent">
          <!-- 기본 정보 및 장비 가용 여부, 병상 정보가 동적으로 추가될 부분 -->
        </div>
  
        <!-- 모달 푸터 -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Specialty Modal -->
<div class="modal fade" id="specialtyModal" tabindex="-1" aria-labelledby="specialtyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="specialtyModalLabel">병원 세부 정보</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="specialtyModalBody">
          <!-- 동적으로 채워질 내용 -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  

    
    <!-- OpenLayers JS -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios CDN 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 통합된 커스텀 JS -->
    <script src="/js/app.js"></script>
</body>

</html>
